  <text x="540" y="340" fill="#6ea8ff" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="13" letter-spacing="2.5">ПРИВАТНЫЕ ПРОЕКТЫ</text>
  <text x="540" y="374" fill="#d7deea" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">Почти весь код лежит в приватных</text>
  <text x="540" y="400" fill="#d7deea" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">репозиториях, поэтому ниже</text>
  <text x="540" y="426" fill="#d7deea" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">статистика по языкам.</text>
