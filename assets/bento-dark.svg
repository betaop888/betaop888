<svg width="800" height="440" viewBox="0 0 800 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карточки. Чем занимаюсь: делаю EssentialCrack, форк мода Essential для Minecraft, я его владелец и единственный разработчик, пишу моды и плагины, ещё занимаюсь вебом фуллстек. EssentialCrack: форк Essential, сервер проекта в Discord. Приватные проекты: почти весь код в приватных репозиториях, поэтому ниже статистика по языкам.">
  <defs>
    <radialGradient id="bA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f6fd6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#3f6fd6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3f6fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2a952" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f2a952" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f2a952" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ea8ff" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#6ea8ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .d1{animation:d1 24s ease-in-out infinite alternate}
    .d2{animation:d2 28s ease-in-out infinite alternate}
    .d3{animation:d3 26s ease-in-out infinite alternate}
    @keyframes d1{from{transform:translate(-10px,-8px)}to{transform:translate(14px,10px)}}
    @keyframes d2{from{transform:translate(12px,6px)}to{transform:translate(-14px,-10px)}}
    @keyframes d3{from{transform:translate(-8px,10px)}to{transform:translate(12px,-8px)}}
    @media (prefers-reduced-motion: reduce){.d1,.d2,.d3{animation:none}}
  </style>

  <rect x="0" y="0" width="492" height="440" rx="22" fill="#101623" stroke="#1f2a3a"/>
  <ellipse class="d1" cx="400" cy="360" rx="220" ry="150" fill="url(#bA)"/>
  <g fill="#8fb4ff">
    <rect x="52" y="330" width="8" height="8" opacity="0.08"/>
    <rect x="64" y="330" width="8" height="8" opacity="0.05"/>
    <rect x="58" y="342" width="8" height="8" opacity="0.06"/>
    <rect x="70" y="342" width="8" height="8" opacity="0.09"/>
  </g>
  <text x="40" y="84" fill="#6ea8ff" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="13" letter-spacing="2.5">ЧЕМ ЗАНИМАЮСЬ</text>
  <text x="40" y="146" fill="#eef2f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Делаю EssentialCrack, форк мода Essential</text>
  <text x="40" y="178" fill="#eef2f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">для Minecraft. Я его владелец и</text>
  <text x="40" y="210" fill="#eef2f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">единственный разработчик. Пишу моды</text>
  <text x="40" y="242" fill="#eef2f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">и плагины, ещё занимаюсь вебом,</text>
  <text x="40" y="274" fill="#eef2f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">фуллстек.</text>

  <rect x="516" y="0" width="284" height="200" rx="22" fill="#101623" stroke="#1f2a3a"/>
  <ellipse class="d2" cx="700" cy="60" rx="150" ry="110" fill="url(#bB)"/>
