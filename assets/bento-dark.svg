  <text x="540" y="76" fill="#6ea8ff" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="13" letter-spacing="2.5">ESSENTIALCRACK</text>
  <text x="540" y="122" fill="#d7deea" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">Форк Essential для Minecraft.</text>
  <text x="540" y="148" fill="#d7deea" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">Сервер проекта в Discord.</text>

  <rect x="516" y="220" width="284" height="220" rx="22" fill="#101623" stroke="#1f2a3a"/>
