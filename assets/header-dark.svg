<svg width="800" height="340" viewBox="0 0 800 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nertin, betaop888. Minecraft modding, EssentialCrack, full-stack.">
  <defs>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f6fd6" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#3f6fd6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3f6fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2a952" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#f2a952" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f2a952" stop-opacity="0"/>
    </radialGradient>
    <pattern id="px" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="3" height="3" fill="#8fb4ff" opacity="0.05"/>
      <rect x="17" y="11" width="3" height="3" fill="#8fb4ff" opacity="0.04"/>
      <rect x="9" y="20" width="3" height="3" fill="#8fb4ff" opacity="0.045"/>
      <rect x="21" y="22" width="3" height="3" fill="#f2a952" opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .driftA{animation:driftA 26s ease-in-out infinite alternate}
    .driftB{animation:driftB 31s ease-in-out infinite alternate}
    @keyframes driftA{from{transform:translate(-16px,-10px)}to{transform:translate(20px,14px)}}
    @keyframes driftB{from{transform:translate(18px,10px)}to{transform:translate(-20px,-12px)}}
    @media (prefers-reduced-motion: reduce){.driftA,.driftB{animation:none}}
  </style>
  <rect width="800" height="340" fill="#0a0e15"/>
  <rect width="800" height="340" fill="url(#px)"/>
  <ellipse class="driftA" cx="170" cy="130" rx="250" ry="160" fill="url(#blobA)"/>
  <ellipse class="driftB" cx="650" cy="270" rx="270" ry="170" fill="url(#blobB)"/>
  <g fill="#8fb4ff">
    <rect x="688" y="292" width="9" height="9" opacity="0.14"/>
    <rect x="700" y="292" width="9" height="9" opacity="0.08"/>
    <rect x="694" y="304" width="9" height="9" opacity="0.1"/>
    <rect x="706" y="304" width="9" height="9" opacity="0.16"/>
    <rect x="712" y="298" width="9" height="9" opacity="0.07"/>
  </g>
  <text x="400" y="168" text-anchor="middle" fill="#eef2f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="100" font-weight="700" letter-spacing="10">Nertin</text>
  <text x="400" y="212" text-anchor="middle" fill="#6ea8ff" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="15" letter-spacing="9">BETAOP888</text>
  <g font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="13" letter-spacing="2">
    <rect x="139" y="248" width="196" height="36" rx="18" fill="#101623" stroke="#26314a"/>
    <text x="237" y="271" text-anchor="middle" fill="#9aa7ba">MINECRAFT MODDING</text>
    <rect x="349" y="248" width="168" height="36" rx="18" fill="#101623" stroke="#26314a"/>
    <text x="433" y="271" text-anchor="middle" fill="#9aa7ba">ESSENTIALCRACK</text>
    <rect x="531" y="248" width="130" height="36" rx="18" fill="#101623" stroke="#26314a"/>
    <text x="596" y="271" text-anchor="middle" fill="#9aa7ba">FULL-STACK</text>
  </g>
</svg>
